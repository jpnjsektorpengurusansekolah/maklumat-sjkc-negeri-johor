  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    body {
      background-color: #f0f3f8;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #2c3e50;
    }

    /* 紧凑型 Header */
    .header-box {
      background: linear-gradient(135deg, #0a3d91 0%, #062663 100%);
      color: white;
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 8px 20px rgba(10, 61, 145, 0.2);
      border-bottom: 3px solid #f1c40f;
    }

    .header-logo {
      max-height: 60px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0px 2px 6px rgba(0,0,0,0.3));
    }

    .sys-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .org-subtitle {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #f1c40f;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .org-unit {
      font-size: 0.72rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      margin-bottom: 0;
    }

    /* 强化防错落的搜索框布局 */
    .search-card {
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,0.05);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      background: #ffffff;
    }

    .custom-search-box {
      display: flex;
      width: 100%;
      align-items: center;
    }

    .search-input {
      font-size: 1rem;
      border-radius: 10px 0 0 10px !important;
      padding: 12px 18px;
      border: 2px solid #e2e8f0;
      background-color: #f8fafc;
      width: 100%;
      outline: none;
    }

    .search-input:focus {
      border-color: #0a3d91;
      background-color: #ffffff;
    }

    .search-btn {
      border-radius: 0 10px 10px 0 !important;
      padding: 12px 28px !important;
      font-weight: 600;
      background-color: #0a3d91;
      border: 2px solid #0a3d91;
      color: white;
      white-space: nowrap;
      cursor: pointer;
    }

    .search-btn:hover {
      background-color: #062663;
      border-color: #062663;
      color: white;
    }

    /* 结果展示卡片 */
    .result-card {
      border-radius: 16px;
      border: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      background: white;
      overflow: hidden;
    }
