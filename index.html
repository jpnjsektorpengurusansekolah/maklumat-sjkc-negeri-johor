<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Carian Maklumat SJKC Johor</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 图标 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- SheetJS Excel 读取库 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .header-box {
      background: linear-gradient(135deg, #0d6efd, #0d47a1);
      color: white;
      border-radius: 16px;
      padding: 30px 20px;
      box-shadow: 0 4px 20px rgba(13, 110, 253, 0.2);
    }
    .header-logo {
      max-height: 85px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0px 2px 6px rgba(0,0,0,0.2));
    }
    .search-card {
      border-radius: 16px;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .search-input {
      font-size: 1.1rem;
      border-radius: 10px 0 0 10px;
      padding: 12px 20px;
      border: 2px solid #dee2e6;
    }
    .search-input:focus {
      border-color: #0d6efd;
      box-shadow: none;
    }
    .search-btn {
      border-radius: 0 10px 10px 0;
      padding: 12px 25px;
      font-weight: 600;
    }
    .result-card {
      border-radius: 16px;
      border: none;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      background: white;
      overflow: hidden;
    }
    .result-header {
      background-color: #eef5ff;
      border-bottom: 2px solid #d0e2ff;
      padding: 18px 25px;
    }
    .info-label {
      font-size: 0.85rem;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .info-value {
      font-size: 1.1rem;
      color: #212529;
      font-weight: 600;
    }
    .status-badge {
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <div class="container py-5" style="max-width: 850px;">
    
    <!-- 1. 顶部 Header (包含 Logo) -->
    <div class="header-box text-center mb-4">
      <div class="mb-3">
        <!-- Logo 图片，若加载失败会自动隐藏 -->
        <img src="./logo.png" alt="Logo JPNJ" class="header-logo" onerror="this.style.display='none'">
      </div>
      <h2 class="fw-bold mb-2">Sistem Carian Maklumat SJKC Johor</h2>
      <p class="mb-0 opacity-75">JPNJ Sektor Pengurusan Sekolah</p>
    </div>

    <!-- 2. 搜索框区域 -->
    <div class="card search-card p-4 mb-4">
      <label class="form-label fw-bold text-dark mb-2">
        <i class="fa-solid fa-magnifying-glass text-primary me-1"></i> Masukkan Kod Sekolah:
      </label>
      <div class="input-group">
        <input id="search-code" type="text" class="form-control search-input" placeholder="Contoh: JBC1001..." onkeyup="if(event.key === 'Enter') searchSchool()">
        <button onclick="searchSchool()" class="btn btn-primary search-btn">
          <i class="fa-solid fa-search me-1"></i> Cari
        </button>
      </div>
      <div id="loading-spinner" class="mt-3 text-muted d-none">
        <div class="spinner-border spinner-border-sm text-primary me-1" role="status"></div>
        Sedang memuatkan pangkalan data sekolah...
      </div>
    </div>

    <!-- 3. 未找到结果提示 -->
    <div id="not-found-msg" class="alert alert-warning text-center rounded-4 d-none">
      <i class="fa-solid fa-triangle-exclamation me-2"></i>
      <span id="not-found-text">Kod Sekolah tidak dijumpai. Sila pastikan Kod Sekolah adalah betul.</span>
    </div>

    <!-- 4. 查询结果展示卡片 -->
    <div id="result-card" class="result-card d-none">
      <div class="result-header d-flex justify-content-between align-items-center">
        <div>
          <span class="badge bg-primary status-badge mb-1" id="display-col-a">KOD SEKOLAH</span>
          <h4 class="fw-bold text-dark mb-0" id="display-col-b">-</h4>
        </div>
        <span class="badge bg-success status-badge"><i class="fa-solid fa-circle-check me-1"></i>Rekod Dijumpai</span>
      </div>

      <div class="card-body p-4">
        <div class="row g-4">
          <!-- Column C -->
          <div class="col-md-6 border-bottom pb-3">
            <div class="info-label" id="label-col-c">Maklumat Column C</div>
            <div class="info-value" id="val-col-c">-</div>
          </div>

          <!-- Column D -->
          <div class="col-md-6 border-bottom pb-3">
            <div class="info-label" id="label-col-d">Maklumat Column D</div>
            <div class="info-value" id="val-col-d">-</div>
          </div>

          <!-- Column E -->
          <div class="col-md-6 pt-2">
            <div class="info-label" id="label-col-e">Maklumat Column E</div>
            <div class="info-value" id="val-col-e">-</div>
          </div>

          <!-- Column F -->
          <div class="col-md-6 pt-2">
            <div class="info-label" id="label-col-f">Maklumat Column F</div>
            <div class="info-value" id="val-col-f">-</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    let schoolDatabase = [];
    let headers = [];

    // 页面加载时自动读取数据库
    window.onload = function() {
      fetchDatabase();
    };

    async function fetchDatabase() {
      const spinner = document.getElementById('loading-spinner');
      spinner.classList.remove('d-none');

      try {
        const response = await fetch('./database.xlsx?v=' + new Date().getTime());
        if (!response.ok) {
          throw new Error("Pangkalan data 'database.xlsx' tidak dijumpai.");
        }
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
        
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        
        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        if (rows.length > 0) {
          headers = rows[0];
          schoolDatabase = rows.slice(1);

          document.getElementById('label-col-c').innerText = headers[2] || 'Column C';
          document.getElementById('label-col-d').innerText = headers[3] || 'Column D';
          document.getElementById('label-col-e').innerText = headers[4] || 'Column E';
          document.getElementById('label-col-f').innerText = headers[5] || 'Column F';
        }
      } catch (err) {
        console.log("Status Database:", err.message);
      } finally {
        spinner.classList.add('d-none');
      }
    };

    function searchSchool() {
      const inputCode = document.getElementById('search-code').value.trim().toUpperCase();
      const resultCard = document.getElementById('result-card');
      const notFoundMsg = document.getElementById('not-found-msg');

      if (!inputCode) {
        alert("Sila masukkan Kod Sekolah!");
        return;
      }

      const matchedRow = schoolDatabase.find(row => {
        return row[0] && row[0].toString().trim().toUpperCase() === inputCode;
      });

      if (matchedRow) {
        notFoundMsg.classList.add('d-none');

        document.getElementById('display-col-a').innerText = matchedRow[0] || '-';
        document.getElementById('display-col-b').innerText = matchedRow[1] || '-';
        document.getElementById('val-col-c').innerText = matchedRow[2] || '-';
        document.getElementById('val-col-d').innerText = matchedRow[3] || '-';
        document.getElementById('val-col-e').innerText = matchedRow[4] || '-';
        document.getElementById('val-col-f').innerText = matchedRow[5] || '-';

        resultCard.classList.remove('d-none');
      } else {
        resultCard.classList.add('d-none');
        document.getElementById('not-found-text').innerText = `Kod Sekolah "${inputCode}" tidak dijumpai dalam pangkalan data.`;
        notFoundMsg.classList.remove('d-none');
      }
    }
  </script>
</body>
</html>
