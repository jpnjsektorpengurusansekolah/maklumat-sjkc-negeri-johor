<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Carian Maklumat SJKC Johor</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 图标库 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- SheetJS Excel 读取库 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    body {
      background-color: #f0f3f8;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #2c3e50;
    }

    /* 紧凑精致的 Header 设计 */
    .header-box {
      background: linear-gradient(135deg, #0a3d91 0%, #062663 100%);
      color: white;
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 8px 20px rgba(10, 61, 145, 0.2);
      border-bottom: 3px solid #f1c40f;
    }

    .header-logo {
      max-height: 60px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0px 2px 6px rgba(0,0,0,0.3));
    }

    .sys-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .org-subtitle {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #f1c40f;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .org-unit {
      font-size: 0.72rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      margin-bottom: 0;
    }

    /* 搜索框设计 */
    .search-card {
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,0.05);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      background: #ffffff;
    }

    .search-input {
      font-size: 1rem;
      border-radius: 10px 0 0 10px;
      padding: 12px 18px;
      border: 2px solid #e2e8f0;
      background-color: #f8fafc;
    }

    .search-input:focus {
      border-color: #0a3d91;
      background-color: #ffffff;
      box-shadow: none;
    }

    .search-btn {
      border-radius: 0 10px 10px 0;
      padding: 12px 24px;
      font-weight: 600;
      background-color: #0a3d91;
      border-color: #0a3d91;
    }

    .search-btn:hover {
      background-color: #062663;
      border-color: #062663;
    }

    /* 结果卡片设计 */
    .result-card {
      border-radius: 16px;
      border: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      background: white;
      overflow: hidden;
    }

    .result-header {
      background: #f8fafc;
      border-bottom: 2px solid #edf2f7;
      padding: 18px 24px;
    }

    .info-box {
      background-color: #f8fafc;
      border-radius: 12px;
      padding: 14px 16px;
      border: 1px solid #edf2f7;
      height: 100%;
    }

    .info-label {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 1.05rem;
      color: #0f172a;
      font-weight: 600;
      word-break: break-word;
    }

    .status-badge {
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container py-4" style="max-width: 820px;">
    
    <!-- 1. Header 模块 (Sistem 标题置顶) -->
    <div class="header-box text-center mb-3">
      <div class="d-flex align-items-center justify-content-center gap-3">
        <!-- Logo -->
        <img src="./logo.png" alt="Logo JPNJ" class="header-logo" onerror="this.style.display='none'">
        
        <div class="text-start">
          <!-- 系统名称置顶 -->
          <h1 class="sys-title">Sistem Carian Maklumat SJKC Johor</h1>
          <!-- 部门与单位资讯在下方 -->
          <div class="org-subtitle">JABATAN PENDIDIKAN NEGERI JOHOR</div>
          <div class="org-unit">SEKTOR PENGURUSAN SEKOLAH | UNIT PRASEKOLAH DAN RENDAH</div>
        </div>
      </div>
    </div>

    <!-- 2. 搜索框卡片 -->
    <div class="card search-card p-3 mb-3">
      <label class="form-label fw-bold text-dark mb-2 style="font-size: 0.9rem;">
        <i class="fa-solid fa-magnifying-glass text-primary me-2"></i>Masukkan Kod Sekolah:
      </label>
      <div class="input-group">
        <input id="search-code" type="text" class="form-control search-input" placeholder="Contoh: JBC1001..." onkeyup="if(event.key === 'Enter') searchSchool()">
        <button onclick="search
