<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Carian Maklumat SJKC Johor</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 图标库 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- SheetJS Excel 读取库 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body {
      background-color: #f0f3f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #2c3e50;
    }

    .header-box {
      background: linear-gradient(135deg, #0a3d91 0%, #062663 100%);
      color: white;
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 8px 20px rgba(10, 61, 145, 0.2);
      border-bottom: 3px solid #f1c40f;
    }

    .header-logo {
      max-height: 60px;
      width: auto;
      object-fit: contain;
    }

    .sys-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .org-subtitle {
      font-size: 0.8rem;
      font-weight: 700;
      color: #f1c40f;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .org-unit {
      font-size: 0.72rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      margin-bottom: 0;
    }

    .search-card {
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,0.05);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      background: #ffffff;
    }

    .custom-search-container {
      display: flex;
      width: 100%;
    }

    .search-input {
      font-size: 1rem;
      border-radius: 10px 0 0 10px !important;
      padding: 12px 18px;
      border: 2px solid #e2e8f0;
      background-color: #f8fafc;
      flex: 1;
      outline: none;
    }

    .search-input:focus {
      border-color: #0a3d91;
      background-color: #ffffff;
    }

    .search-btn {
      border-radius: 0 10px 10px 0 !important;
      padding: 12px 28px !important;
      font-weight: 600;
      background-color: #0a3d91;
      border: 2px solid #0a3d91;
      color: white;
      white-space: nowrap;
      cursor: pointer;
    }

    .search-btn:hover {
      background-color: #062663;
      border-color: #062663;
      color: white;
    }

    .result-card {
      border-radius: 16px;
      border: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      background: white;
      overflow: hidden;
    }

    .result-header {
      background: #f8fafc;
      border-bottom: 2px solid #edf2f7;
      padding: 18px 24px;
    }

    .info-box {
      background-color: #f8fafc;
      border-radius: 12px;
      padding: 12px 16px;
      border: 1px solid #edf2f7;
      height: 100%;
    }

    .info-label {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 1rem;
      color: #0f172a;
      font-weight: 600;
      word-break: break-word;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #0d6efd;
      color: white !important;
      padding: 6px 16px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background-color 0.2s ease;
    }

    .download-btn:hover {
      background-color: #0b5ed7;
      color: white !important;
    }

    .status-badge {
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container py-4" style="max-width: 860px;">
    
    <!-- 1. Header 模块 -->
    <div class="header-box text-center mb-3">
      <div class="d-flex align-items-center justify-content-center gap-3">
        <img src="./logo.png" alt="Logo JPNJ" class="header-logo" onerror="this.style.display='none'">
        <div class="text-start">
          <h1 class="sys-title">Sistem Carian Maklumat SJKC Johor</h1>
          <div class="org-subtitle">JABATAN PENDIDIKAN NEGERI JOHOR</div>
          <div class="org-unit">SEKTOR PENGURUSAN SEKOLAH | UNIT PRASEKOLAH DAN RENDAH</div>
        </div>
      </div>
    </div>

    <!-- 2. 搜索框区域 -->
    <div class="card search-card p-3 mb-3">
      <label class="form-label fw-bold text-dark mb-2" style="font-size: 0.9rem;">
        <i class="fa-solid fa-magnifying-glass text-primary me-2"></i>Masukkan Kod Sekolah:
      </label>
      <div class="custom-search-container">
        <input id="search-code" type="text" class="search-input" placeholder="Contoh: JBC1001..." oninput="searchSchool()" onkeyup="if(event.key === 'Enter') searchSchool()">
        <button onclick="searchSchool()" class="search-btn" type="button">
          <i class="fa-solid fa-search me-1"></i> Cari
        </button>
      </div>
      <div id="loading-spinner" class="mt-2 text-muted d-none" style="font-size: 0.85rem;">
        <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
        Sedang memuatkan pangkalan data...
      </div>
    </div>

    <!-- 3. 未找到数据提示 -->
    <div id="not-found-msg" class="alert alert-warning text-center rounded-4 shadow-sm d-none py-3 mb-3">
      <i class="fa-solid fa-circle-exclamation me-2 fs-5 align-middle"></i>
      <span id="not-found-text" class="fw-semibold">Kod Sekolah tidak dijumpai. Sila pastikan Kod Sekolah adalah betul.</span>
    </div>

    <!-- 4. 查询结果显示卡片 (展示 Column B 到 Column L) -->
    <div id="result-card" class="result-card d-none">
      <div class="result-header d-flex justify-content-between align-items-center">
        <div>
          <span class="badge bg-primary status-badge mb-1" id="display-col-a">KOD SEKOLAH</span>
          <h3 class="fw-bold text-dark mb-0" id="display-col-b" style="font-size: 1.3rem;">-</h3>
        </div>
        <span class="badge bg-success status-badge"><i class="fa-solid fa-check-circle me-1"></i>Rekod Dijumpai</span>
      </div>

      <div class="card-body p-3">
        <div class="row g-3" id="details-container"></div>
      </div>
    </div>

  </div>

  <script>
    let schoolDatabase = [];
    let headers = [];

    window.onload = function() {
      fetchDatabase();
    };

    async function fetchDatabase() {
      const spinner = document.getElementById('loading-spinner');
      if (spinner) spinner.classList.remove('d-none');

      try {
        const response = await fetch('./database.xlsx?v=' + new Date().getTime());
        if (!response.ok) {
          throw new Error("Pangkalan data 'database.xlsx' tidak dijumpai.");
        }
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
        
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        
        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

        if (rows && rows.length > 0) {
          headers = rows[0] || [];
          schoolDatabase = rows.slice(1);
        }
      } catch (err) {
        console.error("Status Database:", err.message);
      } finally {
        if (spinner) spinner.classList.add('d-none');
      }
    };

    function searchSchool() {
      const inputCode = document.getElementById('search-code').value.trim().toUpperCase();
      const resultCard = document.getElementById('result-card');
      const notFoundMsg = document.getElementById('not-found-msg');
      const container = document.getElementById('details-container');

      if (!inputCode) {
        resultCard.classList.add('d-none');
        notFoundMsg.classList.add('d-none');
        return;
      }

      const matchedRow = schoolDatabase.find(row => {
        if (!row || row[0] === undefined || row[0] === null) return false;
        return String(row[0]).trim().toUpperCase() === inputCode;
      });

      if (matchedRow) {
        notFoundMsg.classList.add('d-none');

        // Column A (Index 0) 和 Column B (Index 1)
        document.getElementById('display-col-a').innerText = (matchedRow[0] !== undefined && matchedRow[0] !== '') ? matchedRow[0] : '-';
        document.getElementById('display-col-b').innerText = (matchedRow[1] !== undefined && matchedRow[1] !== '') ? matchedRow[1] : '-';

        let cardsHTML = '';
        // 循环 Column C 到 Column L (Index 2 到 11)
        for (
